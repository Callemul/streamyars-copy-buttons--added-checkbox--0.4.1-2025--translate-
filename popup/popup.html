<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>StreamYard Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
</head>
<body>

    <div class="tabs">
        <button class="tab-link active" data-tab="tab-prayers">🙏 Молитовні</button>
        <button class="tab-link" data-tab="tab-telegram">Telegram Питання 🚀</button>
        <button class="tab-link" data-tab="tab-old">Трансліт / Налаштування</button>
    </div>

    <div id="tab-prayers" class="tab-content active">
        <div class="stats-bar">
            <span class="stat-item total">
                Разом: <b id="prayersTotalCount">0 люд. - 0 прохань</b>
            </span>
        </div>
        
        <div class="btn-row">
            <button id="copyPrayersBtn" class="action-btn success">📋 Скопіювати всі прохання</button>
            <button id="fetchPrayersBtn" class="action-btn primary" title="Підтягнути зіркові коментарі з ефіру">🔄 Підтягнути</button>
            <button id="clearPrayersBtn" class="action-btn danger" title="Очистити список">🗑</button>
        </div>

        <div class="result-wrapper">
            <div id="prayersResultDiv" class="rich-editor" contenteditable="true"></div>
        </div>
    </div>

    <div id="tab-telegram" class="tab-content">
        <div class="input-group">
            <label class="section-title">1. Старий список <span id="oldTotalCount"></span>:</label>
            <textarea id="oldList" placeholder="Вставте сюди весь текст з минулого разу..."></textarea>
        </div>

        <div class="input-group">
            <label class="section-title">2. Номери ВІДПОВІДЕЙ (видалити):</label>
            <input type="text" id="answeredIds" placeholder="Напр: 1, 3, 8.1">
        </div>

        <div class="input-group">
            <label class="section-title">3. Новий список: <span id="tgTotalCount"></span></label>
            <textarea id="newTelegram" placeholder="Вставте нові питання з Телеграму..."></textarea>
        </div>

        <div class="btn-row">
            <button id="processTelegramBtn" class="action-btn primary">ОБРОБИТИ СПИСОК 🚀</button>
            <button id="clearStateBtn" class="action-btn danger" title="Очистити">🗑</button>
        </div>

        <div id="statsBar" class="stats-bar">
            <span class="stat-item old">Залишилось старих: <b id="countOld">0</b></span>
            <span class="stat-item del">Видалено: <b id="countDel">0</b></span>
            <span class="stat-item new">Нових: <b id="countNew">0</b></span>
            <span class="stat-item total">Разом: <b id="countTotal">0</b></span>
        </div>

        <div class="input-group">
            <label class="section-title">Результат:</label>
            <div class="result-wrapper">
                <button id="copyResultBtn" class="copy-btn-top">📋 Скопіювати текст</button>
                <div id="finalResultDiv" class="rich-editor" contenteditable="true"></div>
            </div>
        </div>

        <details id="deletedLogDetails">
            <summary>🗑 Лог видаленого</summary>
            <div id="deletedLog" class="deleted-log"></div>
        </details>
    </div>

    <div id="tab-old" class="tab-content">
        <h1>Transliteration</h1>
        <table>
            <tr><td><textarea id="textArea1_oldText" rows="5" placeholder="Input text..."></textarea></td></tr>
            <tr><td><textarea id="textArea2_generatedRuText" rows="5"></textarea></td></tr>
        </table>
        <button id="Translate" class="action-btn">Translate</button>

        <hr>
        <h3>Налаштування</h3>
        <div class="settings-box">
            <input type="text" id="sschoolName" placeholder="Назва СШ">
            <button id="sschoolNameBtn" class="small-btn">Змінити СШ</button>
        </div>
        <div class="settings-box">
            <input type="text" id="preachNameInput" placeholder="Назва Проповіді">
            <button id="preachNameBtn" class="small-btn">Змінити Проповідь</button>
        </div>
    </div>

    <script src="../lib/jquery-3.5.0.js"></script>
    <script src="popup_init.js"></script>
    <script src="popup_translit.js"></script>
    <script src="popup_telegram.js"></script>
    <script src="popup_prayers.js"></script>
</body>
</html>
