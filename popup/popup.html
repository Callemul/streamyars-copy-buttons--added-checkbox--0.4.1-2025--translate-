<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>StreamYard Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
</head>
<body>

    <div class="tabs" role="tablist" aria-label="Вкладки розширення">
        <button class="tab-link active" role="tab" aria-selected="true" aria-controls="tab-prayers" data-tab="tab-prayers" aria-label="Молитовні">🙏 Молитовні</button>
        <button class="tab-link" role="tab" aria-selected="false" aria-controls="tab-telegram" data-tab="tab-telegram" aria-label="Telegram/YouTube Питання">Telegram/YouTube Питання 🚀</button>
        <button class="tab-link" role="tab" aria-selected="false" aria-controls="tab-old" data-tab="tab-old" aria-label="Трансліт та Налаштування">Трансліт / Налаштування</button>
    </div>

    <div id="tab-prayers" class="tab-content active" role="tabpanel" aria-label="Молитовні">
        <div class="stats-bar">
            <span class="stat-item total">
                Разом: <b id="prayersTotalCount">0 люд. - 0 прохань</b>
            </span>
        </div>
        
        <div class="btn-row">
            <button id="copyPrayersBtn" class="action-btn success" aria-label="Скопіювати всі прохання">📋 Скопіювати всі прохання</button>
            <button id="fetchPrayersBtn" class="action-btn primary" title="Підтягнути зіркові коментарі з ефіру" aria-label="Підтягнути зіркові коментарі з ефіру">🔄 Підтягнути</button>
            <button id="clearPrayersBtn" class="action-btn danger" title="Очистити список" aria-label="Очистити список прохань">🗑</button>
        </div>

        <div class="result-wrapper">
            <div id="prayersResultDiv" class="rich-editor" contenteditable="true" aria-label="Результат молитовних прохань"></div>
        </div>
    </div>

    <div id="tab-telegram" class="tab-content" role="tabpanel" aria-label="Telegram/YouTube Питання">
        <div class="subtabs" role="tablist" aria-label="Аркуші питань">
            <div class="subtabs-track">
                <button class="subtab-button active" role="tab" aria-selected="true" data-sheet="vp_ss" aria-label="Время перемен СШ">Время перемен СШ</button>
                <button class="subtab-button" role="tab" aria-selected="false" data-sheet="oparin" aria-label="Опарин проповеди">Опарин проповеди</button>
                <button class="subtab-button" role="tab" aria-selected="false" data-sheet="molchanov_ss" aria-label="Молчанов СШ">Молчанов СШ</button>
                <button class="subtab-button" role="tab" aria-selected="false" data-sheet="molchanov_preach" aria-label="Молчанов проповеди">Молчанов проповеди</button>
            </div>
        </div>

        <!-- DYNAMIC SHEET CONTAINER (Rendered from #sheet-content-template via JS) -->
        <div id="sheet-contents-container"></div>

        <!-- REUSABLE SHEET CONTENT TEMPLATE -->
        <template id="sheet-content-template">
            <div class="sheet-content" role="tabpanel">
                <div class="input-group">
                    <label class="section-title">1. Старий список <span class="js-old-total-count"></span>:</label>
                    <textarea class="js-old-list" placeholder="Вставте сюди весь текст з минулого разу..." aria-label="Старий список питань"></textarea>
                </div>

                <div class="input-group">
                    <label class="section-title">2. Номери ВІДПОВІДЕЙ (видалити):</label>
                    <input type="text" class="js-answered-ids" placeholder="Напр: 1, 3, 8.1" aria-label="Номери відповідей для видалення">
                </div>

                <div class="input-group">
                    <label class="section-title">
                        3. Новий список:
                        <span class="js-tg-total-count-all counter-badge counter-total"></span>
                    </label>
                    <div class="step3-columns js-step3-columns">
                        <div class="step3-col step3-col-left js-step3-left">
                            <div class="col-header">
                                📝 Telegram (ручний ввід)
                                <span class="js-tg-total-count-left counter-badge counter-left" style="display:none;"></span>
                            </div>
                            <textarea class="js-new-telegram" placeholder="Вставте нові питання з Телеграму..." aria-label="Нові питання з Телеграму"></textarea>
                        </div>

                        <div class="step3-divider js-step3-divider" title="Перетягніть для зміни розміру"></div>

                        <div class="step3-col step3-col-right js-step3-right">
                            <div class="col-header">
                                🎬 YouTube Studio
                                <span class="js-tg-total-count-right counter-badge counter-right" style="display:none;"></span>
                                <button class="col-header-btn js-clear-yt-collected" title="Очистити зібрані" aria-label="Очистити зібрані з YouTube">🗑</button>
                            </div>
                            <div class="yt-collected-list js-yt-collected-list" aria-label="Зібрані коментарі з YouTube"></div>
                        </div>
                    </div>
                </div>

                <div class="btn-row">
                    <button class="action-btn primary js-process-btn" aria-label="Обробити коментарі">ОБРОБИТИ КОМЕНТАРІ 🚀</button>
                    <button class="action-btn danger js-clear-state-btn" title="Очистити" aria-label="Очистити список питань">🗑</button>
                </div>

                <div class="stats-bar js-stats-bar">
                    <div class="stats-row">
                        <div class="stat-item old">Залишилось старих: <b class="js-count-old">0</b></div>
                        <div class="stat-item del">Видалено: <b class="js-count-del">0</b></div>
                    </div>
                    <div class="stats-row new-row">
                        <div class="stat-item new">Нові з лівої: <span class="js-count-new-left">0</span></div>
                        <div class="stat-item new-yt">Нові з YouTube: <b class="js-count-new-yt">0</b></div>
                    </div>
                    <div class="stats-row total-row">
                        <div class="stat-item total">Разом: <b class="js-count-total">0</b></div>
                    </div>
                </div>

                <div class="input-group">
                    <label class="section-title">Результат:</label>
                    <div class="result-wrapper">
                        <button class="copy-btn-top js-copy-result-btn" aria-label="Скопіювати результат">📋 Скопіювати текст</button>
                        <div class="rich-editor js-final-result-div" contenteditable="true" aria-label="Фінальний результат питань Telegram"></div>
                    </div>
                </div>

                <details class="js-deleted-log-details">
                    <summary>🗑 Лог видаленого <span class="log-count js-deleted-log-count"></span></summary>
                    <div class="deleted-log js-deleted-log">
                        <div class="del-empty-msg" style="color: #9ca3af; padding: 6px; font-style: italic;">Видалень немає</div>
                    </div>
                </details>

                <details class="js-cleaned-log-details">
                    <summary>🧹 Лог чистки тексту <span class="log-count js-cleaned-log-count"></span></summary>
                    <div class="cleaned-log js-cleaned-log">
                        <div class="clean-empty-msg" style="color: #9ca3af; padding: 6px; font-style: italic;">Очищених фраз чи нікнеймів немає</div>
                    </div>
                </details>
            </div>
        </template>
    </div>

    <div id="tab-old" class="tab-content" role="tabpanel" aria-label="Трансліт та Налаштування">
        <h1>Transliteration</h1>
        <table>
            <tr><td><textarea id="textArea1_oldText" rows="5" placeholder="Input text..." aria-label="Вхідний текст для транслітерації"></textarea></td></tr>
            <tr><td><textarea id="textArea2_generatedRuText" rows="5" aria-label="Результат транслітерації"></textarea></td></tr>
        </table>
        <button id="Translate" class="action-btn" aria-label="Перекласти">Translate</button>

        <hr>
        <h3>Налаштування</h3>
        <div class="settings-box">
            <input type="text" id="sschoolName" placeholder="Назва СШ" aria-label="Назва Суботньої школи">
            <button id="sschoolNameBtn" class="small-btn" aria-label="Змінити назву Суботньої школи">Змінити СШ</button>
        </div>
        <div class="settings-box">
            <input type="text" id="preachNameInput" placeholder="Назва Проповіді" aria-label="Назва проповіді">
            <button id="preachNameBtn" class="small-btn" aria-label="Змінити назву проповіді">Змінити Проповідь</button>
        </div>
        <div class="settings-box" style="margin-top: 10px;">
            <button id="openOptionsPageBtn" class="action-btn primary" style="width: 100%;" aria-label="Відкрити розширені налаштування">⚙️ Розширені Налаштування (Options)</button>
        </div>
    </div>

    <script type="module" src="popup_init.ts"></script>
    <script type="module" src="popup_translit.ts"></script>
    <script type="module" src="popup_telegram.ts"></script>
    <script type="module" src="popup_prayers.ts"></script>
</body>
</html>
