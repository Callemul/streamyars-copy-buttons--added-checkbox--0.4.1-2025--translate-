<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>StreamYard Tools</title>
    <link rel="stylesheet" href="popup.css">
    <style>
        :root { --primary: #2b7de9; --bg: #f4f4f9; --old-color: #fff9c4; --new-color: #e8f5e9; --del-color: #ffebee; }
        body { width: 780px; min-height: 400px; padding: 15px; font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); margin: 0; overflow-x: hidden; box-sizing: border-box; }
        .tabs { display: flex; border-bottom: 2px solid #ddd; margin-bottom: 20px; }
        .tab-link { flex: 1; padding: 12px; background: none; border: none; border-bottom: 3px solid transparent; cursor: pointer; font-weight: bold; color: #666; font-size: 14px; transition: 0.3s; }
        .tab-link:hover { background-color: #e9e9e9; }
        .tab-link.active { color: var(--primary); border-bottom-color: var(--primary); background-color: #fff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        textarea { width: 100%; border: 1px solid #ccc; border-radius: 4px; padding: 8px; box-sizing: border-box; font-family: inherit; font-size: 13px; resize: vertical; height: 100px; }
        input[type="text"], input[type="date"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .result-wrapper { position: relative; }
        .rich-editor { width: 100%; height: 400px; border: 1px solid var(--primary); border-radius: 4px; padding: 10px; padding-top: 35px; box-sizing: border-box; font-family: inherit; font-size: 13px; overflow-y: auto; background-color: white; white-space: pre-wrap; }
        .q-block { padding: 8px; margin-bottom: 8px; border-radius: 4px; border: 1px solid #ddd; }
        .q-old { background-color: var(--old-color); border-left: 5px solid #fbc02d; }
        .q-new { background-color: var(--new-color); border-left: 5px solid #4caf50; }
        .q-pray { background-color: #e3f2fd; border-left: 5px solid #2196f3; }
        .stats-bar { display: flex; gap: 10px; margin: 10px 0; font-size: 13px; flex-wrap: wrap; }
        .stat-item { padding: 5px 12px; border-radius: 20px; background: #eee; border: 1px solid transparent; }
        .stat-item.old { background: var(--old-color); border-color: #fbc02d; }
        .stat-item.new { background: var(--new-color); border-color: #4caf50; }
        .stat-item.del { background: var(--del-color); border-color: #ef5350; }
        .stat-item.total { background: #e1f5fe; border-color: #03a9f4; }
        .deleted-log { max-height: 100px; overflow-y: auto; background: var(--del-color); padding: 5px; font-size: 11px; border: 1px solid #ef5350; border-radius: 4px; }
        .del-row { border-bottom: 1px dashed #ffa4a2; padding: 2px 0; }
        .btn-row { display: flex; gap: 5px; }
        .action-btn { width: 100%; padding: 10px; border: none; border-radius: 5px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; color: #333; background: #ddd; transition: 0.2s; }
        .action-btn.primary { background-color: var(--primary); color: white; }
        .action-btn.primary:hover { background-color: #1a60c0; }
        .action-btn.success { background-color: #28a745; color: white; }
        .action-btn.success:hover { background-color: #1e7e34; }
        .action-btn.danger { background-color: #dc3545; color: white; }
        .copy-btn-top { position: absolute; top: 5px; right: 5px; background-color: #28a745; color: white; border: none; border-radius: 4px; padding: 6px 12px; font-size: 13px; cursor: pointer; font-weight: bold; z-index: 10; opacity: 0.9; }
        .copy-btn-top:hover { opacity: 1; }
        .small-btn { padding: 5px 10px; margin-top: 5px; cursor: pointer; }
        .settings-box { margin-bottom: 10px; padding: 10px; background: white; border-radius: 5px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .section-title { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 5px; color: #444; font-size: 14px; }
    </style>
</head>
<body>

    <div class="tabs">
        <button class="tab-link active" data-tab="tab-prayers">🙏 Молитовні</button>
        <button class="tab-link" data-tab="tab-telegram">Telegram Питання 🚀</button>
        <button class="tab-link" data-tab="tab-old">Трансліт / Налаштування</button>
    </div>

    <div id="tab-prayers" class="tab-content active">
        <div class="stats-bar">
            <span class="stat-item total" style="background:#e3f2fd; border:1px solid #2196f3; font-weight:bold;">
                Разом: <b id="prayersTotalCount">0 люд. - 0 прохань</b>
            </span>
        </div>
        
        <div class="btn-row" style="margin-bottom: 15px;">
            <button id="copyPrayersBtn" class="action-btn success" style="margin-top: 0;">📋 Скопіювати всі прохання</button>
            <button id="clearPrayersBtn" class="action-btn danger" style="width: auto; margin-top: 0;" title="Очистити список">🗑</button>
        </div>

        <div class="result-wrapper">
            <div id="prayersResultDiv" class="rich-editor" style="padding-top: 10px;" contenteditable="true"></div>
        </div>
    </div>

    <div id="tab-telegram" class="tab-content">
        <div class="input-group">
            <label class="section-title">1. Старий список <span id="oldTotalCount" style="color: #666; font-weight: normal;"></span>:</label>
            <textarea id="oldList" placeholder="Вставте сюди весь текст з минулого разу..."></textarea>
        </div>

        <div class="input-group">
            <label class="section-title">2. Номери ВІДПОВІДЕЙ (видалити):</label>
            <input type="text" id="answeredIds" placeholder="Напр: 1, 3, 8.1">
        </div>

        <div class="input-group">
            <label class="section-title">3. Новий список: <span id="tgTotalCount" style="color: #666; font-weight: normal;"></span></label>
            <textarea id="newTelegram" placeholder="Вставте нові питання з Телеграму..."></textarea>
        </div>

        <div class="btn-row">
            <button id="processTelegramBtn" class="action-btn primary">ОБРОБИТИ СПИСОК 🚀</button>
            <button id="clearStateBtn" class="action-btn danger" style="width: auto; margin-left: 5px;" title="Очистити">🗑</button>
        </div>

        <div id="statsBar" class="stats-bar" style="display:none;">
            <span class="stat-item old">Залишилось старих: <b id="countOld">0</b></span>
            <span class="stat-item del">Видалено: <b id="countDel">0</b></span>
            <span class="stat-item new">Нових: <b id="countNew">0</b></span>
            <span class="stat-item total">Разом: <b id="countTotal">0</b></span>
        </div>

        <div class="input-group">
            <label class="section-title">Результат:</label>
            <div class="result-wrapper">
                <button id="copyResultBtn" class="copy-btn-top">📋 Скопіювати текст</button>
                <div id="finalResultDiv" class="rich-editor" contenteditable="true"></div>
            </div>
        </div>

        <details id="deletedLogDetails" style="display:none; margin-top: 10px;">
            <summary>🗑 Лог видаленого</summary>
            <div id="deletedLog" class="deleted-log"></div>
        </details>
    </div>

    <div id="tab-old" class="tab-content">
        <h1>Transliteration</h1>
        <table>
            <tr><td><textarea id="textArea1_oldText" rows="5" placeholder="Input text..."></textarea></td></tr>
            <tr><td><textarea id="textArea2_generatedRuText" rows="5"></textarea></td></tr>
        </table>
        <button id="Translate" class="action-btn">Translate</button>

        <hr>
        <h3>Налаштування</h3>
        <div class="settings-box">
            <input type="text" id="sschoolName" placeholder="Назва СШ">
            <button id="sschoolNameBtn" class="small-btn">Змінити СШ</button>
        </div>
        <div class="settings-box">
            <input type="text" id="preachNameInput" placeholder="Назва Проповіді">
            <button id="preachNameBtn" class="small-btn">Змінити Проповідь</button>
        </div>
    </div>

    <script src="../lib/jquery-3.5.0.js"></script>
    <script src="popup_init.js"></script>
    <script src="popup_translit.js"></script>
    <script src="popup_telegram.js"></script>
    <script src="popup_prayers.js"></script>
</body>
</html>
